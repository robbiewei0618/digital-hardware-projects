name: Setup Verilator
description: Build (or restore from cache) Verilator from source, plus z3 and build deps
inputs:
  version:
    description: Verilator git tag
    default: v5.054
runs:
  using: composite
  steps:
    - name: Install build dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq git autoconf flex bison help2man perl make g++ \
          libfl-dev zlib1g-dev ccache z3 python3 > /dev/null

    - name: Restore Verilator from cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/verilator
        key: verilator-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build Verilator ${{ inputs.version }}
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone --depth 1 --branch ${{ inputs.version }} https://github.com/verilator/verilator.git /tmp/verilator-src
        cd /tmp/verilator-src
        autoconf
        ./configure --prefix=$HOME/verilator
        make -j$(nproc)
        make install

    - name: Add Verilator to PATH
      shell: bash
      run: |
        echo "$HOME/verilator/bin" >> $GITHUB_PATH
        $HOME/verilator/bin/verilator --version
